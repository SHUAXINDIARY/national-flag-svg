<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rough Emoji</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #1f2933;
        background: #f4f8f5;
      }

      .app {
        width: min(960px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
      }

      input,
      button {
        height: 40px;
        border: 1px solid #2f3437;
        border-radius: 6px;
        font: inherit;
      }

      input {
        width: min(220px, 100%);
        padding: 0 12px;
        background: #fbfdfa;
        font-size: 22px;
      }

      button {
        padding: 0 14px;
        color: #fbfdfa;
        background: #24312c;
        cursor: pointer;
      }

      button.secondary {
        color: #24312c;
        background: #fbfdfa;
      }

      .stage {
        overflow: auto;
        border: 1px solid #d9e3db;
        border-radius: 8px;
        background: #fbfdfa;
        box-shadow: 0 18px 44px rgb(36 49 44 / 8%);
      }

      canvas {
        display: block;
        margin: 0 auto;
        width: min(100%, 720px);
        height: auto;
        aspect-ratio: 1;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <form class="toolbar" id="emoji-form">
        <input
          id="emoji-input"
          name="emoji"
          maxlength="12"
          autocomplete="off"
          placeholder="😀 / 中国"
          aria-label="Emoji"
        />
        <button type="submit">绘制</button>
        <button class="secondary" id="download-button" type="button">
          下载 PNG
        </button>
      </form>

      <section class="stage">
        <canvas id="rough-canvas" width="720" height="720"></canvas>
      </section>
    </main>

    <script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
    <script src="./dist/rough-emoji.js"></script>
  </body>
</html>
